<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#aee3ff 0%, #dff4ff 55%, #ffe9c9 100%);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
  }
  svg { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <clipPath id="scene"><rect width="1200" height="675"/></clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <!-- 太阳 -->
    <circle cx="980" cy="130" r="58" fill="url(#sun)"/>
    <circle cx="980" cy="130" r="74" fill="none" stroke="#ffd98a" stroke-width="3" stroke-dasharray="4 14" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 980 130" to="360 980 130" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- 云（慢视差） -->
    <g fill="#ffffff" opacity="0.85">
      <g>
        <ellipse cx="150" cy="120" rx="70" ry="24"/>
        <ellipse cx="210" cy="105" rx="55" ry="20"/>
        <ellipse cx="90"  cy="108" rx="45" ry="18"/>
        <animateTransform attributeName="transform" type="translate" from="1300 0" to="-400 0" dur="55s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="600" cy="80" rx="60" ry="20"/>
        <ellipse cx="655" cy="66" rx="42" ry="16"/>
        <animateTransform attributeName="transform" type="translate" from="700 0" to="-900 0" dur="42s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0 500 Q 180 380 360 470 T 720 460 T 1080 480 T 1200 470 L1200 675 L0 675 Z" fill="#9fd4a8" opacity="0.7"/>

    <!-- 地面滚动石子（快视差） -->
    <g stroke="#c9b48a" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="640" x2="14" y2="640"/>
      <line x1="180" y1="648" x2="190" y2="648"/>
      <line x1="360" y1="638" x2="376" y2="638"/>
      <line x1="560" y1="646" x2="568" y2="646"/>
      <line x1="760" y1="640" x2="774" y2="640"/>
      <line x1="960" y1="648" x2="970" y2="648"/>
      <animateTransform attributeName="transform" type="translate" from="1200 0" to="-1200 0" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <rect x="0" y="655" width="1200" height="20" fill="#e8d8ae"/>

    <!-- 路边树/灌木（中速视差） -->
    <g>
      <g>
        <rect x="-6" y="560" width="12" height="60" fill="#8a6238"/>
        <circle cx="0" cy="540" r="46" fill="#4f9e58"/>
        <circle cx="34" cy="560" r="34" fill="#5cb06a"/>
        <circle cx="-32" cy="562" r="30" fill="#468c50"/>
        <animateTransform attributeName="transform" type="translate" from="1350 0" to="-200 0" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="-5" y="600" width="10" height="30" fill="#8a6238"/>
        <circle cx="0" cy="588" r="30" fill="#5cb06a"/>
        <circle cx="22" cy="602" r="22" fill="#4f9e58"/>
        <animateTransform attributeName="transform" type="translate" from="1600 0" to="-300 0" dur="1.5s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- ===== 自行车 + 鹈鹕（整体轻微颠簸；车头朝右） ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="450,150; 450,156; 450,150" dur="0.22s" repeatCount="indefinite"/>

      <!-- 车架：后轮(300,460) 前轮(470,460) 五通(385,405) 座管顶(325,330) 头管(455,315) -->
      <g stroke="#e2574c" stroke-width="7" fill="none" stroke-linecap="round">
        <path d="M300 460 L 385 405"/>   <!-- 后下叉 -->
        <path d="M300 460 L 325 330"/>   <!-- 后上叉 -->
        <path d="M385 405 L 325 330"/>   <!-- 座管 -->
        <path d="M385 405 L 452 320"/>   <!-- 下管 -->
        <path d="M325 330 L 452 320"/>   <!-- 上管 -->
        <path d="M470 460 L 455 315"/>   <!-- 前叉 -->
        <path d="M325 330 L 318 316"/>   <!-- 座杆 -->
        <!-- 车把 -->
        <path d="M455 315 L 458 296 Q 458 285 447 284" stroke="#5a3a22"/>
        <circle cx="447" cy="284" r="6" fill="#3a2a1a" stroke="none"/>
        <!-- 曲柄+踏板：整体绕五通(385,405)旋转，踏板反相自转保持水平 -->
        <g stroke="#7d4a2b" stroke-width="6" fill="none">
          <animateTransform attributeName="transform" type="rotate" from="0 385 405" to="360 385 405" dur="0.35s" repeatCount="indefinite"/>
          <line x1="385" y1="405" x2="402" y2="423"/>
          <line x1="385" y1="405" x2="368" y2="387"/>
          <g stroke="#444" stroke-width="6">
            <animateTransform attributeName="transform" type="rotate" from="0 402 423" to="-360 402 423" dur="0.35s" repeatCount="indefinite"/>
            <line x1="392" y1="423" x2="412" y2="423"/>
          </g>
          <g stroke="#444" stroke-width="6">
            <animateTransform attributeName="transform" type="rotate" from="0 368 387" to="-360 368 387" dur="0.35s" repeatCount="indefinite"/>
            <line x1="358" y1="387" x2="378" y2="387"/>
          </g>
        </g>
        <circle cx="385" cy="405" r="9" fill="#5a3a22" stroke="none"/>
      </g>
      <!-- 车座 -->
      <ellipse cx="316" cy="312" rx="26" ry="9" fill="#5a3a22"/>

      <!-- ===== 车轮 ===== -->
      <g>
        <circle cx="300" cy="460" r="58" fill="none" stroke="#2d2d2d" stroke-width="8"/>
        <circle cx="300" cy="460" r="52" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#888" stroke-width="2">
          <line x1="252" y1="460" x2="348" y2="460"/>
          <line x1="300" y1="412" x2="300" y2="508"/>
          <line x1="266" y1="426" x2="334" y2="494"/>
          <line x1="266" y1="494" x2="334" y2="426"/>
          <animateTransform attributeName="transform" type="rotate" from="0 300 460" to="360 300 460" dur="0.35s" repeatCount="indefinite"/>
        </g>
        <circle cx="300" cy="460" r="8" fill="#555"/>
      </g>
      <g>
        <circle cx="470" cy="460" r="58" fill="none" stroke="#2d2d2d" stroke-width="8"/>
        <circle cx="470" cy="460" r="52" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#888" stroke-width="2">
          <line x1="422" y1="460" x2="518" y2="460"/>
          <line x1="470" y1="412" x2="470" y2="508"/>
          <line x1="436" y1="426" x2="504" y2="494"/>
          <line x1="436" y1="494" x2="504" y2="426"/>
          <animateTransform attributeName="transform" type="rotate" from="0 470 460" to="360 470 460" dur="0.35s" repeatCount="indefinite"/>
        </g>
        <circle cx="470" cy="460" r="8" fill="#555"/>
      </g>

      <!-- ===== 鹈鹕（坐在车座上，面朝右） ===== -->
      <g>
        <!-- 腿：髋部(320,312) → 踏板圆周(圆心385,405 半径24)，脚点逐帧跟踪踏板 -->
        <path d="M320 312 Q 340 368 409 423" fill="none" stroke="#f5a94b" stroke-width="9" stroke-linecap="round">
          <animate attributeName="d"
            values="M320 312 Q 346 362 409 423;
                    M320 312 Q 344 384 397 418;
                    M320 312 Q 336 394 361 423;
                    M320 312 Q 340 380 373 428;
                    M320 312 Q 346 362 409 423"
            dur="0.35s" repeatCount="indefinite"/>
        </path>
        <path d="M326 314 Q 362 380 361 423" fill="none" stroke="#f09a35" stroke-width="9" stroke-linecap="round">
          <animate attributeName="d"
            values="M326 314 Q 336 394 361 423;
                    M326 314 Q 340 380 373 428;
                    M326 314 Q 346 362 409 423;
                    M326 314 Q 344 384 397 418;
                    M326 314 Q 336 394 361 423"
            dur="0.35s" repeatCount="indefinite"/>
        </path>

        <!-- 尾羽（贴着身体后侧，朝左下） -->
        <path d="M272 296 Q 246 306 228 304" fill="none" stroke="#f5b768" stroke-width="14" stroke-linecap="round"/>
        <path d="M270 310 Q 248 324 230 326" fill="none" stroke="#f0a94b" stroke-width="12" stroke-linecap="round"/>

        <!-- 身体（坐在车座上） -->
        <ellipse cx="318" cy="296" rx="64" ry="40" fill="#ffd28a" stroke="#e8a54b" stroke-width="3" transform="rotate(-14 318 296)"/>

        <!-- 翅膀（扶向车把） -->
        <path d="M348 272 Q 402 280 440 286" fill="none" stroke="#f5b768" stroke-width="12" stroke-linecap="round">
          <animate attributeName="d"
            values="M348 272 Q 402 280 440 286;
                    M348 272 Q 402 276 438 280;
                    M348 272 Q 402 280 440 286"
            dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M330 272 Q 296 292 314 320 Q 348 322 360 294 Q 352 276 330 272 Z"
              fill="#ffd28a" stroke="#e8a54b" stroke-width="2"/>

        <!-- 脖子 -->
        <path d="M352 266 Q 394 242 406 196 Q 411 166 400 156" fill="none" stroke="#ffd28a" stroke-width="22" stroke-linecap="round"/>

        <!-- 头 -->
        <circle cx="400" cy="154" r="30" fill="#ffd28a" stroke="#e8a54b" stroke-width="3"/>

        <!-- 大嘴（朝右，张合） -->
        <path d="M418 146 Q 498 140 508 154 Q 480 166 418 162 Z" fill="#f5a623" stroke="#d98a1f" stroke-width="2">
          <animate attributeName="d"
            values="M418 146 Q 498 140 508 154 Q 480 166 418 162 Z;
                    M418 146 Q 498 136 508 148 Q 480 156 418 158 Z;
                    M418 146 Q 498 140 508 154 Q 480 166 418 162 Z"
            dur="0.8s" repeatCount="indefinite"/>
        </path>
        <!-- 喉囊 -->
        <path d="M420 160 Q 460 194 500 162 Q 470 174 422 166 Z" fill="#ffb84d" stroke="#d98a1f" stroke-width="2">
          <animate attributeName="opacity" values="0.9;0.55;0.9" dur="0.8s" repeatCount="indefinite"/>
        </path>

        <!-- 眼睛 -->
        <circle cx="404" cy="148" r="5" fill="#2b2b2b">
          <animate attributeName="r" values="5;5;0.6;5" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="406" cy="146" r="1.6" fill="#fff"/>

        <!-- 呆毛 -->
        <path d="M396 126 Q 390 112 378 110" fill="none" stroke="#f5b768" stroke-width="4" stroke-linecap="round">
          <animate attributeName="d"
            values="M396 126 Q 390 112 378 110;
                    M396 126 Q 394 110 382 104;
                    M396 126 Q 390 112 378 110"
            dur="1s" repeatCount="indefinite"/>
        </path>

        <!-- 围巾（向身后飘） -->
        <path d="M372 232 Q 350 226 334 234" fill="none" stroke="#e2574c" stroke-width="10" stroke-linecap="round"/>
        <path d="M330 236 Q 308 232 292 246" fill="none" stroke="#e2574c" stroke-width="8" stroke-linecap="round">
          <animate attributeName="d"
            values="M330 236 Q 308 232 292 246;
                    M330 236 Q 304 240 286 230;
                    M330 236 Q 310 226 296 242;
                    M330 236 Q 308 232 292 246"
            dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

  </g>
</svg>
</body>
</html>
